<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.20.1/vis.css" type="text/css" />
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.20.1/vis-network.min.js"> </script>
        <script src="../static/scripts/indexScript.js"></script>
        <script src="../static/scripts/drawGraph.js"></script>
        <script src="../static/scripts/drawPlot.js"></script>
        <script src="../static/scripts/configureNetworkActivations.js"></script>
        <script src="../static/scripts/trainScript.js"></script>
        <script src="../static/scripts/notify.js"></script>
        <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
        <link rel="stylesheet" href="../static/stylesheets/guideStyle.css">
        <link rel="stylesheet" href="../static/stylesheets/generalStyle.css">
        <link rel="stylesheet" href="../static/stylesheets/progress.css">
        <link rel="stylesheet" href="../static/stylesheets/trainStyle.css">
        <link href='https://fonts.googleapis.com/css?family=Open+Sans' rel='stylesheet' type='text/css'>
        <title>NNViz</title>
    </head>
    <body>
        <div id="navbarDiv">
            <nav class="navbar navbar-expand-lg" id="navbar">
                <div class="logo">
                    <img src="../static/images/NNViz%20Logo%202.png" width="200" alt="" id="logo">
                </div>
                <div class="navbar-collapse collapse w-100 order-1 order-md-0 dual-collapse2" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" id="homeLink" href="/">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="homeLink" href="/guide">Guide</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="homeLink" href="/train">Train</a>
                        </li>
                    </ul>
                </div>
            </nav>
        </div>
        <div class="header">
            <h2><b>Train</b> the Neural Network</h2>
        </div>
        <div class="train-div">
            <div class="configure-train-panel">
                <div class="configure-train-container">
                    <p>Training Controls</p>
                    <div class="row">
                        <div class="col">
                            <br>
                            <label for="epochs" class="form-label">Epochs</label>
                            <input type="number" min="10" max="50" step="1" id="epochs" name="epochs" value="30" class="form-control">
                        </div>
                        <div class="col">
                            <br>
                            <label for="batch-size"  class="form-label">Batch size</label>
                            <input type="number" min="1" max="50" step="1" id="batch-size" name="batch_size" value="25" class="form-control">
                        </div>
                        <div class="col">
                            <label for="learning-rate"  class="form-label">Learning rate</label>
                            <input type="number" min="0.001" max="0.5" step="0.001" id="learning-rate" name="learning_rate" value="0.01" class="form-control">
                        </div>
                        <div hidden class="col">
                            <label hidden for="sag_ratio" id="sag_ratio-label" class="form-label">Train Task</label>
                            <select hidden class="form-control" id="sag_ratio" name="sag_ratio">
                                 <option  value="0.4">0.4</option>
                                 <option value="0.6">0.4</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col">
                            <button disabled id="train-btn" class="btn-primary btn">Train</button>
                        </div>
                    </div>
                </div>
                <div class="configure-train-container">
                    <p>Training Configuration</p>
                        <div class="row">
                            <div class="col">
                                <label for="sel_task" id="sel_task-label" class="form-label">Training Task</label>
                                <select class="form-control" id="sel_task" name="sel_task">
                                    <option  value="class">Classification</option>
                                    <option value="seg">Segmentation</option>
                                </select>
                            </div>
                            <div class="col">
                                <label for="sel_net" class="form_label" id="sel_net-label">Network Architecture</label>
                                <select class="form-control" id="sel_net" name="sel_net">
                                    <option value="pointnet">PointNet</option>
                                    <option value="gcn">GCN</option>
                                </select>
                            </div>
                            <div class="col">
                                <a href="/train/change_input"><button class="btn-primary btn configure-train-btn">Change Input</button></a>
                            </div>
                        <div class="row">
                            <div class="col">
                                <button class="btn-primary btn configure-train-btn apply-btn" id="reset-btn">Reset</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <br>
            <div class="nn-graph-div white-bg">
                <img hidden id="nn-graph-img-pointnet-class" src="../static/images/pointnet/PointNet_Class.drawio.svg"/>
                <img hidden id="nn-graph-img-pointnet-seg" src="../static/images/pointnet/PointNet_Seg.drawio.svg"/>
                <img hidden id="nn-graph-img-gcn-class" src="../static/images/gcn/GCN_Class.drawio.svg" style="transform: scale(0.9);"/>
                <img hidden id="nn-graph-img-gcn-seg" src="../static/images/gcn/GCN_Seg.drawio.svg"/>
            </div>

            <div class="history-plots">
                <div  class="plot white-bg">
                    <div id="act-plot" class="scale-085"></div>
                </div>
                <div  class="plot white-bg">
                    <div id="pred-plot" class="scale-085"></div>
                </div>
            </div>

            <div class="history-plots">
                <div id="loss-plot" class="plot white-bg"></div>
                <div id="acc-plot" class="plot white-bg"></div>
            </div>
        </div>
    </body>
</html>
